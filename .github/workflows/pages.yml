name: Pages

# Deploys site/ to GitHub Pages. Pages on a private repository needs a paid plan, so this job does
# nothing until the repository variable PAGES_ENABLED is set to "true" (Settings → Secrets and
# variables → Actions → Variables) and Pages is set to deploy from GitHub Actions (Settings → Pages).
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
