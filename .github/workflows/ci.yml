name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suites make real commits in temp repos; a fresh runner has no git identity.
      - run: |
          git config --global user.name "planestro ci"
          git config --global user.email "ci@planestro.invalid"
          git config --global init.defaultBranch main
      - run: npm run typecheck
      # The suites drive real git in temp dirs; none of them touches the network, GitHub or Claude.
      - run: npm test
      - run: npm run build
