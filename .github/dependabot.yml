version: 2
updates:
  # Grouped and monthly: one PR to review, and major versions (vite, vitest, TypeScript) are left for a deliberate upgrade.
  - package-ecosystem: npm
    directory: /
    target-branch: develop # main moves only at releases (#443)
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop # main moves only at releases (#443)
    schedule:
      interval: monthly
